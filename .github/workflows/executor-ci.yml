name: In-cluster executor rehearsal
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/rehearse-executor

  chart-admission:
    name: Monitoring hooks and Helm history
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v4.3.2
        # Fail when the published checksum is missing or does not match.
        checksum-policy: required
    - name: Install the YAML and crypto dependencies used in the rehearsal
      run: python3 -m pip install -c scripts/demo/oci-cli-constraints.txt PyYAML cryptography
    - name: Download the pinned local API and etcd
      working-directory: ${{ runner.temp }}
      run: |
        curl -fsSLo envtest.tgz https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.36.0/envtest-v1.36.0-linux-amd64.tar.gz
        echo 'd84f910bcefa3f6ab0205a49a7255672150c73b14bca3c36ac627db65040edf0  envtest.tgz' | sha256sum --check
        tar -xzf envtest.tgz
    - name: Fetch the reviewed chart sources and verify their digests
      env:
        PYTHONPATH: scripts/demo
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        import scheduled_inputs

        staging = Path(os.environ["RUNNER_TEMP"]) / "chart-sources"
        staging.mkdir()
        scheduled_inputs.charts_for(Path.cwd(), staging, scheduled_inputs.public_env(staging))
        monitoring, = (staging / "charts").glob("kube-prometheus-stack-*.tgz")
        with open(os.environ["GITHUB_ENV"], "a") as env_file:
            print(f"MONITORING_CHART={monitoring}", file=env_file)
        PYTHON
    # Names every rendered object the access matrix lacks, before the slower
    # rehearsals reject the same charts without saying which object it was.
    - name: Compare the pinned chart renders with the reviewed access matrix
      run: python3 scripts/demo/access_matrix.py --charts "$RUNNER_TEMP/chart-sources/charts"
    - name: Verify create and delete for twelve exact hook objects and deny unapproved changes
      run: |
        python3 scripts/demo/rehearsals/helm-history/rehearse-six-release-history.py \
          --assets "$RUNNER_TEMP/controller-tools/envtest" --receipt "$RUNNER_TEMP/hook-result.json" \
          --monitoring-hook-access "$MONITORING_CHART"
    - name: Verify the manual deploy identity's guarded grants deny privilege changes
      run: |
        python3 scripts/demo/rehearsals/helm-history/rehearse-six-release-history.py \
          --assets "$RUNNER_TEMP/controller-tools/envtest" --receipt "$RUNNER_TEMP/manual-upgrade.json" \
          --manual-upgrade-access "$RUNNER_TEMP/chart-sources/charts"
    - name: Verify the full monitoring render, frozen upgrade and rollback under restricted identities
      run: |
        python3 scripts/demo/rehearsals/helm-history/rehearse-six-release-history.py \
          --assets "$RUNNER_TEMP/controller-tools/envtest" --receipt "$RUNNER_TEMP/helm-result.json" \
          --frozen-transaction --monitoring-lookup "$MONITORING_CHART"
    - name: Check native per-slot authorization, both Helm apply modes and rollback
      env:
        GOTOOLCHAIN: go1.27.4
        CGO_ENABLED: 0
      run: |
        mkdir -p "$RUNNER_TEMP/preview-bin"
        (cd ops/executor/preview && go mod verify && go test -mod=readonly ./... && go build -mod=readonly -o "$RUNNER_TEMP/preview-bin/jaeger-helm-preview" .)
        PATH="$RUNNER_TEMP/preview-bin:$PATH" python3 scripts/demo/rehearsals/helm-history/rehearse-six-release-history.py \
          --assets "$RUNNER_TEMP/controller-tools/envtest" --receipt "$RUNNER_TEMP/typed-admission.json" --typed-approval-rehearsal
    - name: Stage and verify all six real charts under native admission
      run: |
        PATH="$RUNNER_TEMP/preview-bin:$PATH" python3 scripts/demo/rehearsals/helm-history/rehearse-six-release-history.py \
          --assets "$RUNNER_TEMP/controller-tools/envtest" --receipt "$RUNNER_TEMP/six-chart-approvals.json" \
          --six-chart-approvals "$RUNNER_TEMP/chart-sources/charts" "$RUNNER_TEMP/chart-sources/upstream"
