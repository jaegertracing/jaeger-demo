apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-generator
  template:
    metadata:
      labels:
        app: trace-generator
    spec:
      containers:
      - name: trace-generator
        image: python:3.11.18@sha256:55c475496e35ad8d898659c85f92b42d3b1c58f25f5d79023baf0840b0b4a462
        command:
          - /bin/sh
          - -c
          - |
            python /app/generate_traces.py
        env:
        - name: TARGET_URL
          value: "http://jaeger-hotrod.default.svc.cluster.local:80/hotrod/dispatch"
        - name: SLEEP_SECONDS
          value: "10"
        volumeMounts:
        - name: script-volume
          mountPath: /app
      restartPolicy: Always
      volumes:
      - name: script-volume
        configMap:
          name: trace-script
