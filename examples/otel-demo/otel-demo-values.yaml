# Official values for the pinned chart are at https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.7/charts/opentelemetry-demo/values.yaml

# Keep bundled infra disabled (we deploy Jaeger/OpenSearch separately)
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

# Preserve default.env (to keep OTEL_SERVICE_NAME and OTEL_COLLECTOR_NAME) and add only shared attributes.
default:
  envOverrides:
    # Narrower service namespace + explicit environment tag
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: service.name=$(OTEL_SERVICE_NAME),service.namespace=otel-demo,deployment.environment=oke-dev
    # The in-cluster collector is traces-only. Disable SDK logs/metrics export noise.
    - name: OTEL_LOGS_EXPORTER
      value: none
    - name: OTEL_METRICS_EXPORTER
      value: none

components:
  ad:
    useDefault:
      env: false
    env:
      - name: OTEL_SERVICE_NAME
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: "metadata.labels['app.kubernetes.io/component']"
      - name: OTEL_COLLECTOR_NAME
        value: otel-collector
      - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
        value: cumulative
      - name: OTEL_LOGS_EXPORTER
        value: none
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: AD_PORT
        value: "8080"
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: service.name=$(OTEL_SERVICE_NAME),service.namespace=otel-demo,deployment.environment=oke-dev

  accounting:
    initContainers:
      - name: wait-for-kafka
        image: docker.io/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]

  cart:
    initContainers:
      - name: wait-for-valkey-cart
        image: docker.io/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c", "until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep 2; done;"]
    # No OpAMP server runs here (see opamp-server below). An empty endpoint turns the client off.
    envOverrides:
      - name: OPAMP_SERVER_ENDPOINT
        value: ""

  checkout:
    initContainers:
      - name: wait-for-kafka
        image: docker.io/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
    # The chart default (20Mi, GOMEMLIMIT=16MiB) gets checkout OOM-killed and starves its outbound calls under load.
    envOverrides:
      - name: GOMEMLIMIT
        value: 48MiB
    resources:
      limits:
        memory: 64Mi

  fraud-detection:
    initContainers:
      - name: wait-for-kafka
        image: docker.io/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]

  flagd:
    # Drop the chart's flagd-ui sidecar. The public /feature route proxies to it
    # without authentication and can edit the fault-injection flags. flagd keeps
    # reading the reviewed demo.flagd.json that the init container copies below.
    sidecarContainers: []
    initContainers:
      - name: init-config
        image: docker.io/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c", "cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json"]
        volumeMounts:
          - mountPath: /config-ro
            name: config-ro
          - mountPath: /config-rw
            name: config-rw

  load-generator:
    envOverrides:
      # Run Locust headless. The public /loadgen/ route proxies to the Locust web
      # UI without authentication and can start, stop and resize the load. The load
      # keeps running from LOCUST_USERS/LOCUST_SPAWN_RATE with no UI to expose.
      - name: LOCUST_HEADLESS
        value: "true"
      - name: LOCUST_USERS
        value: "5"
      - name: LOCUST_SPAWN_RATE
        value: "2"

  # The chart owns the Valkey and PostgreSQL images (valkey-cart and astronomy-db).
  # Both hold disposable demo data. Only the database memory limit is raised.
  astronomy-db:
    resources:
      limits:
        memory: 256Mi

  # Keep the chart's environment: the service reads its SDK setup from the
  # mounted OTEL_CONFIG_FILE and emits no traces without it. That file also
  # configures log and metric export, which the traces-only collector rejects.
  product-catalog:
    initContainers:
      - name: wait-for-astronomy-db
        image: docker.io/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c", "until nc -z -v -w30 astronomy-db 5432; do echo waiting for astronomy-db; sleep 2; done;"]
    envOverrides:
      - name: GOMEMLIMIT
        value: 48MiB
      # No OpAMP server runs here (see opamp-server below). An empty endpoint turns the client off.
      - name: OPAMP_SERVER_ENDPOINT
        value: ""
    resources:
      limits:
        memory: 64Mi

  shipping:
    initContainers:
      - name: wait-for-flagd
        image: docker.io/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c", "until nc -z -v -w30 flagd 8013; do echo waiting for flagd; sleep 2; done;"]

  # The assistant stack stays off. Enabling the agent makes the chart render an
  # 828 KB ConfigMap of recorded LLM responses, and the daily executor's
  # approval partitions hold at most 640 KiB. The load generator still asks the
  # agent on about one request in eleven; those requests fail and appear as
  # error spans from the load-generator service.
  agent:
    enabled: false
  mcp:
    enabled: false

  # The shop's proxy serves the OpAMP server's interface at /opamp/, and the
  # shop is public. That interface changes client configuration and connection
  # settings without authentication, so the server is not deployed.
  opamp-server:
    enabled: false
  chatbot:
    enabled: false

# Override Collector config to export traces to Jaeger only and drop demo metrics/logs
opentelemetry-collector:
  image:
    repository: docker.io/otel/opentelemetry-collector-contrib
  # Allow initialization to complete before the existing liveness probe takes over.
  startupProbe:
    httpGet:
      port: 13133
      path: /
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 30
  presets:
    hostMetrics:
      enabled: false
    kubeletMetrics:
      enabled: false
    clusterMetrics:
      enabled: false
    annotationDiscovery:
      metrics:
        enabled: false
  ports:
    otlp:
      hostPort: null
    otlp-http:
      hostPort: null
    jaeger-compact:
      hostPort: null
    jaeger-grpc:
      hostPort: null
    jaeger-thrift:
      hostPort: null
    zipkin:
      hostPort: null
  alternateConfig:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
            cors:
              allowed_origins:
                - http://*
                - https://*
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes: {}
      resource:
        attributes:
          - key: service.instance.id
            from_attribute: k8s.pod.uid
            action: insert
      # The chart's emitRawPii feature flag makes checkout and payment put the
      # customer's email, card number and CVV on their spans. The chart removes them
      # in its default collector pipeline, which alternateConfig replaces. Jaeger is
      # public here, so drop the three attributes whatever the flag says.
      transform/drop_raw_pii:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - delete_key(attributes, "user.email")
              - delete_key(attributes, "demo.payment.card_number")
              - delete_key(attributes, "demo.payment.card_cvv")
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger-collector.jaeger.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:MY_POD_IP}
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, transform/drop_raw_pii, batch]
          exporters: [otlp/jaeger]
